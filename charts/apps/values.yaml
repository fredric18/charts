# bjw-s/common v5.0.1 schema configuration for apps application
controllers:
  main:
    replicas: 2
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/fredric18/apps
          tag: latest
          pullPolicy: IfNotPresent
        # ─────────────────────────────────────────────────────────────────
        # Tier 3 · 런타임 환경변수 (SSOT: .agents/rules/05-config-env.md)
        #
        # 여기에는 "이미지 재빌드 없이 클러스터에서 교체 가능해야 하는 값"만 둡니다.
        #   · 런타임 마운트 볼륨(PVC) 경로 — 아래 persistence.data 의 /data 마운트와 1:1 대응
        #   · 외부 API 자격 증명           — 키 로테이션 시 차트만 갱신하고 롤아웃
        #
        # 🚫 NEXT_PUBLIC_* 변수는 절대 추가하지 않습니다.
        #    `next build` 시점에 번들에 인라인되므로 런타임 env로는 절대 반영되지 않으며,
        #    차트에 넣으면 "설정했는데 적용되지 않는" 착시만 만듭니다.
        #    빌드 타임 공개 변수의 SSOT는 Tier 1 `.env.production` 입니다.
        #
        # 🚫 정적 기초 데이터(명언 도감·운동 도감·운동 이미지) 경로도 등재하지 않습니다.
        #    런타임에 생성되지 않는 읽기 전용 동봉 데이터이므로 항상 이미지 내부의
        #    data-defaults 만 참조하며, 경로는 `@/lib/config`에 고정되어 있습니다.
        #    런타임 볼륨(/data)은 생성·캐시 데이터 전용입니다.
        # ─────────────────────────────────────────────────────────────────
        env:
          # 런타임 생성·캐시 데이터 볼륨 루트 (PVC 마운트 경로 변경 시 여기서 조정)
          DATA_DIR: "/data"
          # 제휴 딜 캐시 (RapidAPI) — 런타임 생성 데이터
          AMAZON_RAPIDAPI_KEY: "aff999bdd9mshcf89354579452aap1cbeb3jsnbfa883e67e64"
          AMAZON_RAPIDAPI_HOST: "real-time-amazon-data.p.rapidapi.com"
          AMAZON_DATA_DIR: "/data/ads"
          AMAZON_DATA_FILE: "/data/ads/amazon-deals.json"
          ALIEXPRESS_RAPIDAPI_KEY: "aff999bdd9mshcf89354579452aap1cbeb3jsnbfa883e67e64"
          ALIEXPRESS_RAPIDAPI_HOST: "aliexpress-business-api.p.rapidapi.com"
          ALIEXPRESS_DATA_DIR: "/data/ads"
          ALIEXPRESS_DATA_FILE: "/data/ads/aliexpress-deals.json"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 10
              periodSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 5
              periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: apps.fredric18.uk
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - secretName: apps-fredric18-tls
        hosts:
          - apps.fredric18.uk

# Pod Security Context for non-root execution and automatic volume write permissions
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"

# Persistent Volume Claim for persistent daily deals caching across pod redeployments
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    retain: true
    globalMounts:
      - path: /data
  next-cache:
    type: emptyDir
    globalMounts:
      - path: /app/.next/cache

# GHCR Private image pull secrets
imagePullSecrets:
  - name: ghcr-secret
