# bjw-s/common v5.0.1 schema configuration for apps application
controllers:
  main:
    replicas: 2
    strategy: Recreate
    containers:
      main:
        image:
          repository: ghcr.io/fredric18/apps
          tag: latest
          pullPolicy: IfNotPresent
        env:
          AMAZON_RAPIDAPI_KEY: "aff999bdd9mshcf89354579452aap1cbeb3jsnbfa883e67e64"
          AMAZON_RAPIDAPI_HOST: "real-time-amazon-data.p.rapidapi.com"
          AMAZON_DATA_DIR: "/data"
          AMAZON_DATA_FILE: "/data/amazon-deals.json"
          ALIEXPRESS_RAPIDAPI_KEY: "aff999bdd9mshcf89354579452aap1cbeb3jsnbfa883e67e64"
          ALIEXPRESS_RAPIDAPI_HOST: "aliexpress-business-api.p.rapidapi.com"
          ALIEXPRESS_DATA_DIR: "/data"
          ALIEXPRESS_DATA_FILE: "/data/aliexpress-deals.json"
          QUOTES_DATA_DIR: "/data"
          QUOTES_DATA_FILE: "/data/quotes.json"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 10
              periodSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 5
              periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: apps.fredric18.uk
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - secretName: apps-fredric18-tls
        hosts:
          - apps.fredric18.uk

# Pod Security Context for non-root execution and automatic volume write permissions
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: "OnRootMismatch"

# Persistent Volume Claim for persistent daily deals caching across pod redeployments
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    retain: true
    globalMounts:
      - path: /data
  next-cache:
    type: emptyDir
    globalMounts:
      - path: /app/.next/cache

# GHCR Private image pull secrets
imagePullSecrets:
  - name: ghcr-secret
