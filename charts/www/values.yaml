# bjw-s/common v5.0.1 schema configuration for www application
controllers:
  main:
    replicas: 2
    containers:
      main:
        image:
          repository: ghcr.io/fredric18/www
          tag: latest
          pullPolicy: IfNotPresent
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 10
              periodSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 3000
              initialDelaySeconds: 5
              periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

ingress:
  main:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: www.fredric18.uk
        paths:
          - path: /
            service:
              identifier: main
              port: http
    tls:
      - secretName: www-fredric18-tls
        hosts:
          - www.fredric18.uk

# GHCR Private image pull secrets
imagePullSecrets:
  - name: ghcr-secret
